name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0  # tags for git describe (the Build line)
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.13"  # as in Debian 13 on the Pi
      - name: Install tools
        run: pip install pytest cryptography pillow ruff shellcheck-py
      - name: Lint Python
        run: ruff check --output-format github .
      - name: Lint shell scripts
        run: shellcheck app/*.sh
      - name: Compile
        run: python -m py_compile app/capture/*.py app/gallery/*.py app/common/*.py
      - name: Tests
        run: pytest -q
