name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0  # tags for git describe (the Build line)
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"  # as in Debian 13 on the Pi
      - name: Install tools
        run: pip install pytest cryptography pillow ruff shellcheck-py
      - name: Lint Python
        run: ruff check --output-format github .
      - name: Lint shell scripts
        run: shellcheck app/*.sh
      - name: Compile
        run: python -m py_compile app/capture/*.py app/gallery/*.py app/common/*.py
      - name: Tests
        run: pytest -q
