<!DOCTYPE html>
<html lang="[[lang]]">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
$app_head<title>$app_name $version</title>
<link rel="stylesheet" href="$css_app">
<link rel="stylesheet" href="$css_watch">
$theme_css</head>
<body>
<div class="viewbar">
  <a class="back" href="#" onclick="if (history.length > 1) history.back(); else location.href = '/'; return false;">${back_icon}[[back]]</a>
  <span class="cap">$caption</span>
</div>
<div class="media" id="media" data-newer="$newer" data-older="$older">$media</div>
<script src="$js_app"></script>
<script src="$js_watch"></script>
</body>
</html>
