<div class="topbar">
  $brand
  $clock
  <button class="appbtn" id="appbtn" hidden title="[[app.install]]" aria-label="[[app.install]]">$apple_icon</button>
  $bell
</div>
<div class="apphint" id="apphint" hidden>
  <h3><img src="$touch_icon" alt="">[[app.install]]</h3>
  <ol>
    <li>[[app.step1]] $share_icon</li>
    <li>[[app.step2]]</li>
    <li>[[app.step3]]</li>
  </ol>
  <button type="button" id="apphint-close">[[app.close]]</button>
</div>
